<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#05070a">
<title>Scroller — Gröna Elden</title>
<meta name="description" content="Scroll through the Gröna Elden archive, one by one.">
<style>
  :root { --bg:#05070a; --ink:#e9edf5; --muted:#8a92a5; --green:#7dbf63; --gold:#c9a24a; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); overflow: hidden;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; -webkit-font-smoothing: antialiased; }

  #feed {
    position: fixed; inset: 0; overflow-y: scroll; overflow-x: hidden;
    scroll-snap-type: y mandatory; overscroll-behavior: contain; scrollbar-width: none;
  }
  #feed::-webkit-scrollbar { display: none; }

  .slide {
    position: relative; height: 100vh; height: 100dvh; width: 100%;
    scroll-snap-align: start; scroll-snap-stop: always; overflow: hidden;
    display: flex; align-items: center; justify-content: center;
  }
  .slide .bgblur {
    position: absolute; inset: -30px; background-size: cover; background-position: center;
    filter: blur(28px) brightness(.45) saturate(1.2); transform: scale(1.1);
  }
  .slide .media {
    position: relative; max-width: 100%; max-height: 100%; object-fit: contain;
    opacity: 0; transition: opacity .25s ease;
    box-shadow: 0 18px 60px rgba(0,0,0,.6);
  }
  .slide .media.on { opacity: 1; }
  .slide.wide .media { border-radius: 0; }

  .top {
    position: fixed; top: 0; left: 0; right: 0; z-index: 10; display: flex; align-items: center; justify-content: space-between;
    padding: max(12px, env(safe-area-inset-top)) 14px 24px;
    background: linear-gradient(rgba(5,7,10,.75), transparent); pointer-events: none;
  }
  .top > * { pointer-events: auto; }
  .back, .count {
    font-size: 12px; letter-spacing: .08em; color: #d9f2cf; text-decoration: none;
    background: rgba(125,191,99,.12); border: 1px solid rgba(125,191,99,.38); border-radius: 10px; padding: 6px 11px;
    backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
  }
  .title { font-size: 10.5px; letter-spacing: .22em; text-transform: uppercase; color: var(--gold); }

  .nav { position: fixed; right: 16px; top: 50%; transform: translateY(-50%); z-index: 10; display: flex; flex-direction: column; gap: 10px; }
  .nav button {
    width: 42px; height: 42px; border-radius: 50%; font-size: 18px; cursor: pointer; color: #d9f2cf;
    background: rgba(125,191,99,.12); border: 1px solid rgba(125,191,99,.38); backdrop-filter: blur(6px);
  }
  .nav button:hover { background: rgba(125,191,99,.24); }
  @media (hover: none) { .nav { display: none; } }

  .hint {
    position: fixed; left: 0; right: 0; bottom: max(20px, env(safe-area-inset-bottom)); z-index: 10; text-align: center;
    font-size: 11px; letter-spacing: .2em; text-transform: uppercase; color: rgba(233,237,245,.7); pointer-events: none;
    animation: bob 1.6s ease-in-out infinite; transition: opacity .4s ease;
  }
  .hint.gone { opacity: 0; }
  @keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }

  #state { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; text-align: center;
    padding: 30px; color: var(--muted); font-size: 14px; line-height: 1.7; z-index: 5; }
  #state b { color: var(--ink); }
  .mute { position: absolute; right: 14px; bottom: 70px; z-index: 5; font-size: 11px; letter-spacing: .1em; color: #d9f2cf;
    background: rgba(0,0,0,.45); border: 1px solid rgba(125,191,99,.38); border-radius: 10px; padding: 5px 9px; display: none; }
  .slide.vid .mute { display: block; }
</style>
</head>
<body>
<div class="top">
  <a class="back" href="../share/">← Archive</a>
  <span class="title">Scroller</span>
  <span class="count" id="count">–</span>
</div>

<div id="feed" tabindex="0"></div>
<div id="state">Opening the archive…</div>

<div class="nav">
  <button id="up" aria-label="Previous">↑</button>
  <button id="down" aria-label="Next">↓</button>
</div>
<div class="hint" id="hint">Swipe up</div>

<script>
(function () {
  var REPO = 'RAT-aye-aye/gronaelden', FOLDER = 'share/media';
  var BASE = new URL('../share/media/', location.href).href;
  var MANIFEST = BASE + 'manifest.json';
  var API = 'https://api.github.com/repos/' + REPO + '/contents/' + FOLDER + '?ref=main';
  var EDGE = 'https://api.gronaelden.com/list';
  var IMAGE = /\.(jpe?g|png|gif|webp|avif)$/i;
  var VIDEO = /\.(mp4|webm)$/i;

  var feed = document.getElementById('feed');
  var stateEl = document.getElementById('state');
  var countEl = document.getElementById('count');
  var hint = document.getElementById('hint');
  var items = [], slides = [], index = 0;

  function parse(data) {
    if (!Array.isArray(data)) return [];
    return data.filter(function (f) {
      var isFile = !f || f.type === undefined || f.type === 'file';
      return f && isFile && (IMAGE.test(f.name) || VIDEO.test(f.name));
    }).map(function (f) {
      return { url: BASE + encodeURIComponent(f.name), kind: VIDEO.test(f.name) ? 'video' : 'img' };
    });
  }
  function getJSON(u, accept) {
    return fetch(u, { headers: { Accept: accept || 'application/json' } }).then(function (r) {
      if (!r.ok) throw new Error('http ' + r.status); return r.json();
    });
  }
  function listLive() {
    return getJSON(EDGE).then(parse).then(function (l) { if (!l.length) throw new Error('empty'); return l; })
      .catch(function () { return getJSON(API, 'application/vnd.github+json').then(parse); })
      .catch(function () { return []; });
  }
  function listManifest() {
    return getJSON(MANIFEST).then(function (d) { return parse(Array.isArray(d) ? d : (d && d.items)); }).catch(function () { return []; });
  }

  function build() {
    feed.innerHTML = '';
    slides = items.map(function (it, i) {
      var s = document.createElement('section');
      s.className = 'slide' + (it.kind === 'video' ? ' vid' : '');
      s.dataset.i = i;
      if (it.kind === 'img') {
        var bgb = document.createElement('div'); bgb.className = 'bgblur'; s.appendChild(bgb);
      }
      var m = document.createElement(it.kind === 'video' ? 'video' : 'img');
      m.className = 'media';
      if (it.kind === 'video') { m.muted = true; m.loop = true; m.playsInline = true; m.setAttribute('playsinline', ''); m.preload = 'metadata'; }
      else m.alt = 'Gröna Elden, ' + (i + 1);
      s.appendChild(m);
      if (it.kind === 'video') {
        var mb = document.createElement('button'); mb.className = 'mute'; mb.textContent = 'Sound off';
        mb.onclick = function (e) { e.stopPropagation(); m.muted = !m.muted; mb.textContent = m.muted ? 'Sound off' : 'Sound on'; };
        s.appendChild(mb);
        s.addEventListener('click', function () { if (m.paused) m.play(); else m.pause(); });
      }
      feed.appendChild(s);
      return s;
    });
    countEl.textContent = '1 / ' + slides.length;
    observe();
  }

  function load(s) {
    if (s.dataset.loaded) return;
    s.dataset.loaded = 1;
    var it = items[+s.dataset.i], m = s.querySelector('.media');
    var bgb = s.querySelector('.bgblur');
    if (it.kind === 'video') { m.src = it.url; m.onloadeddata = function () { m.classList.add('on'); }; }
    else {
      m.onload = function () { m.classList.add('on'); };
      m.onerror = function () { if (!s.dataset.retried) { s.dataset.retried = 1; setTimeout(function () { m.src = it.url + '?r=' + Date.now(); }, 1500); } else { m.classList.add('on'); m.alt = 'Could not load this one'; } };
      m.src = it.url;
      if (bgb) bgb.style.backgroundImage = 'url("' + it.url + '")';
    }
  }

  function observe() {
    var preload = new IntersectionObserver(function (es) {
      es.forEach(function (e) { if (e.isIntersecting) load(e.target); });
    }, { root: feed, rootMargin: '200% 0px' });
    var active = new IntersectionObserver(function (es) {
      es.forEach(function (e) {
        var v = e.target.querySelector('video');
        if (e.isIntersecting) {
          index = +e.target.dataset.i;
          countEl.textContent = (index + 1) + ' / ' + slides.length;
          if (index > 0) hint.classList.add('gone');
          if (v) v.play().catch(function () {});
        } else if (v) v.pause();
      });
    }, { root: feed, threshold: 0.6 });
    slides.forEach(function (s) { preload.observe(s); active.observe(s); });
  }

  function go(d) {
    var t = Math.max(0, Math.min(slides.length - 1, index + d));
    slides[t] && slides[t].scrollIntoView({ behavior: 'smooth', block: 'start' });
  }
  document.getElementById('up').onclick = function () { go(-1); };
  document.getElementById('down').onclick = function () { go(1); };
  window.addEventListener('keydown', function (e) {
    if (e.key === 'ArrowDown' || e.key === 'ArrowRight' || e.key === 'j' || e.key === ' ') { e.preventDefault(); go(1); }
    else if (e.key === 'ArrowUp' || e.key === 'ArrowLeft' || e.key === 'k') { e.preventDefault(); go(-1); }
    else if (e.key === 'Escape') location.href = '../share/';
  });
  feed.focus();

  function listCached() {
    try {
      var d = JSON.parse(sessionStorage.getItem('ge.archive.v1'));
      return { fresh: Date.now() - d.time < 600000, items: parse(d.items) };
    } catch (e) { return { fresh: false, items: [] }; }
  }
  function lastKnown() {
    try { var l = JSON.parse(localStorage.getItem('ge.scroller.last')); return Array.isArray(l) ? l.filter(function (x) { return x && typeof x.url === 'string'; }) : []; }
    catch (e) { return []; }
  }
  var cached = listCached();
  Promise.all([cached.fresh && cached.items.length ? Promise.resolve([]) : listLive(), listManifest()]).then(function (r) {
    var live = r[0];
    if (live.length) {
      items = live;                                   // the real, current list from GitHub
      try { localStorage.setItem('ge.scroller.last', JSON.stringify(live)); } catch (e) {}
    } else {                                          // GitHub unreachable: best backup we have
      items = [cached.items, lastKnown(), r[1]].sort(function (x, y) { return y.length - x.length; })[0];
    }
    if (!items.length) {
      stateEl.innerHTML = '<div><b>No pictures found.</b><br>Add photos or GIFs to the archive and they will show up here.</div>';
      return;
    }
    stateEl.remove();
    build();
  });
})();
</script>
</body>
</html>
