name: disclaimer

# The one rule. If a change takes the disclaimer off a page, this fails.
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Every page must say it is fake, and that the owner is a member
        run: node tools/test-disclaimer.js
