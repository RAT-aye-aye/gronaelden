<style>
  :root {
    --bg: #05070a;
    --line: rgba(255, 255, 255, .08);
    --ink: #e9edf5;
    --muted: #8a92a5;
    --green: #7dbf63;
    --gold: #c9a24a;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    min-height: 100dvh;
    background:
      radial-gradient(90% 55% at 50% 0%, #16211580 0%, transparent 60%),
      var(--bg);
    color: var(--ink);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 18px;
    padding: max(24px, env(safe-area-inset-top)) 20px max(20px, env(safe-area-inset-bottom));
  }

  .head { text-align: center; }
  h1 {
    margin: 0;
    font-size: clamp(22px, 6vw, 28px);
    font-weight: 700;
    letter-spacing: .3px;
  }
  .tag {
    margin: 7px 0 0;
    color: var(--gold);
    font-size: 10.5px;
    letter-spacing: .2em;
    text-transform: uppercase;
  }

  .portrait {
    display: block;
    width: auto;
    max-width: min(100%, 420px);
    max-height: 34vh;
    border-radius: 14px;
    border: 1px solid var(--line);
    box-shadow: 0 18px 50px rgba(0, 0, 0, .55);
  }

  .action {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 14px;
    width: 100%;
    max-width: 420px;
    padding: 13px 16px;
    text-decoration: none;
    color: #d9f2cf;
    background: rgba(125, 191, 99, .10);
    border: 1px solid rgba(125, 191, 99, .38);
    border-radius: 14px;
    transition: background .15s ease, transform .15s ease, border-color .15s ease;
  }
  .action:hover, .action:focus-visible {
    background: rgba(125, 191, 99, .18);
    border-color: rgba(125, 191, 99, .6);
    transform: translateY(-1px);
    outline: none;
  }
  .action strong { display: block; font-size: 15px; font-weight: 650; }
  .action em { display: block; margin-top: 3px; font-size: 11.5px; font-style: normal; color: #9fc98f; }
  .action .arrow { font-size: 18px; color: var(--green); }

  .book {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 9px;
    text-decoration: none;
    color: inherit;
  }
  .book img {
    width: clamp(120px, 32vw, 152px);
    height: auto;
    border-radius: 9px;
    border: 1px solid rgba(201, 162, 74, .32);
    box-shadow: 0 14px 40px rgba(0, 0, 0, .6);
    transition: transform .18s ease, border-color .18s ease, box-shadow .18s ease;
  }
  .book:hover img, .book:focus-visible img {
    transform: translateY(-2px) rotate(-.6deg);
    border-color: rgba(201, 162, 74, .7);
    box-shadow: 0 18px 46px rgba(0, 0, 0, .7);
  }
  .book .label {
    font-size: 11.5px;
    color: var(--muted);
    letter-spacing: .05em;
  }
  .book .label b { color: var(--gold); font-weight: 600; }

  footer {
    margin-top: auto;
    padding: 10px 2px 0;
    max-width: 420px;
    text-align: center;
    border-top: 1px solid var(--line);
    color: #6f7688;
    font-size: 11.5px;
    line-height: 1.65;
  }
  footer .disclaimer { margin: 0; }
  footer .disclaimer b { color: #9aa2b4; font-weight: 600; }
  footer .domain {
    margin: 7px 0 0;
    color: #4d5464;
    font-size: 10px;
    letter-spacing: .14em;
    text-transform: uppercase;
  }
  @media (max-height: 700px) {
    footer { font-size: 10.5px; }
  }
